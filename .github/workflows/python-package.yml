# CI — Simulation de maintenance prédictive hybride
# Vérifie : syntaxe/lint léger + exécution de bout en bout du pipeline
# (génération → simulateur → évaluation) sur plusieurs versions de Python.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pipeline smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          # Déps légères du pipeline (TensorFlow non requis pour la CI :
          # scripts/lstm_model.py est vérifié syntaxiquement uniquement)
          python -m pip install "pandas>=2.0" "numpy>=1.24" "scikit-learn>=1.3" "matplotlib>=3.7"

      - name: Lint (erreurs bloquantes uniquement)
        run: |
          flake8 scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Smoke test — pipeline complet
        run: |
          python scripts/generate_data.py
          python scripts/maintenance_simulator.py
          python scripts/data_preprocessing.py
          python scripts/evaluation.py

      - name: Upload artifacts (plot & résultats)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            results/simulation_plot.png
            results/evaluation_results.txt
          retention-days: 7
